name: Update Gitea Contribution History

on:
  workflow_dispatch:

  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update Gitea history
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node scripts/update-gitea-history.mjs

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gitea-history.json

          if git diff --cached --quiet; then
            echo "No contribution changes."
            exit 0
          fi

          git commit -m "Update Gitea contribution history"
          git push