name: Update Gitea Contribution History

on:
  workflow_dispatch:

  schedule:
    - cron: "59 21 * * 5"

concurrency:
  group: profile-main-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update Gitea history
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: node scripts/update-gitea-history.mjs

      - name: Generate contribution heatmaps
        run: node scripts/generate-heatmap.mjs

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gitea-history.json assets/

          if git diff --cached --quiet; then
            echo "No contribution changes."
            exit 0
          fi

          git commit -m "Update Gitea contribution history"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."

            git fetch origin
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Remote changed during push. Retrying..."
            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1